<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ITI Mitra | Online Practice Exams & Attendance Tracking</title>
    <meta name="description" content="ITI Mitra is an online platform for ITI students to practice mock exams, improve their skills, and prepare for final assessments." />
    <meta name="keywords" content="ITI, Mock Test, Online Exam, ITI Practice, NCVT, SCVT, Industrial Training Institute" />
    <meta name="robots" content="index, follow" />

    <!-- Favicons -->
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/icon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32x32.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="/icons/icon-96x96.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icons/icon-192x192.png" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://itimitra.in/" />
    <meta property="og:title" content="ITI Mitra | Online Practice Exams" />
    <meta property="og:description" content="Practice for your ITI exams with our comprehensive mock tests." />
    <meta property="og:image" content="https://itimitra.in/icons/icon-512x512.png" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://itimitra.in/" />
    <meta property="twitter:title" content="ITI Mitra | Online Practice Exams" />
    <meta property="twitter:description" content="Practice for your ITI exams with our comprehensive mock tests." />
    <meta property="twitter:image" content="https://itimitra.in/icons/icon-512x512.png" />

    <!-- PWA Manifest & Theme Color -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#ffffff" />

    <!-- Sitemap for crawlers -->
    <link rel="sitemap" type="application/xml" title="Sitemap" href="/sitemap.xml" />

    <!-- Structured Data: Website + Sitelinks Search -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "url": "https://itimitra.in/",
      "name": "ITI Mitra",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://itimitra.in/search?query={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
  </head>

  <body>
    <div id="root">
      <div id="app-splash-screen" style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#ffffff;font-family:system-ui,-apple-system,sans-serif;z-index:99999;">
        <div style="position:relative;display:flex;align-items:center;justify-content:center;margin-bottom:18px;">
          <div style="position:absolute;width:115px;height:115px;border-radius:50%;background:rgba(37,99,235,0.1);animation:itipulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;"></div>
          <img src="/icons/icon-192x192.png" alt="ITI Mitra Logo" style="width:80px;height:80px;border-radius:18px;box-shadow:0 8px 24px rgba(37,99,235,0.15);position:relative;z-index:2;" />
        </div>
        <h1 style="font-size:23px;font-weight:800;color:#0f172a;letter-spacing:-0.5px;margin:0 0 6px 0;">ITI Mitra</h1>
        <p style="font-size:13px;color:#64748b;font-weight:500;margin:0 0 24px 0;">Online Practice Exams & Attendance</p>
        <div style="width:32px;height:32px;border:3px solid #e2e8f0;border-top-color:#2563eb;border-radius:50%;animation:itispin 0.8s linear infinite;"></div>
      </div>
      <style>
        @keyframes itispin { to { transform: rotate(360deg); } }
        @keyframes itipulse { 0%, 100% { transform: scale(1); opacity: 0.8; } 50% { transform: scale(1.25); opacity: 0.2; } }
      </style>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
